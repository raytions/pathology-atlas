id: colorectal-cancer
title: Colorectal cancer
organs: [colorectum]
synonyms: [Colorectal adenocarcinoma, CRC]
summary: >-
  Cancer of the colon or rectum, almost always adenocarcinoma. In computational pathology it is
  studied at patch level (tissue composition) as well as at slide level (biomarkers such as
  microsatellite instability, and outcome).
