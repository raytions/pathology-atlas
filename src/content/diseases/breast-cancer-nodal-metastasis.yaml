id: breast-cancer-nodal-metastasis
title: Breast cancer lymph-node metastasis
organs: [breast]
synonyms: [Sentinel lymph node metastasis, SLN metastasis]
summary: >-
  Spread of breast cancer to the sentinel lymph nodes, categorised by the size of the largest
  deposit (macro-metastasis, micro-metastasis, isolated tumour cells). It drives the pN stage.
