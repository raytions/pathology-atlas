id: breast-lesions
title: Breast lesions (benign, atypical, malignant)
organs: [breast]
synonyms: [Breast carcinoma subtypes, Breast lesion spectrum]
summary: >-
  The diagnostic spectrum of breast tissue lesions, from normal and benign changes through
  atypical (pre-cancerous) lesions to in-situ and invasive carcinoma. Some of these categories,
  notably the atypical lesions, are hard to tell apart on H&E.
