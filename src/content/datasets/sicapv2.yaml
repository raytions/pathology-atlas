id: sicapv2
title: SICAPv2
aliases: [SICAP v2, SICAP]
summary: >-
  Prostate core-needle biopsy patches (512 x 512 at 10x) from 155 slides of 95 patients, each with
  a pixel-level Gleason grade mask, plus a primary and secondary Gleason grade per slide and a
  patient-level train / validation / test partition proposed by the authors.
organs: [prostate]
diseases: [prostate-adenocarcinoma]
tasks: [gleason-grading, gleason-pattern-classification]
specimen: H&E prostate core-needle biopsies graded by urogenital pathologists at Hospital Clínico of Valencia, Spain; scanned with a Ventana iScan Coreo at 40x and released as 10x patches.
stains: [he]
data_units: [patch]
annotation_granularity: [slide-label, patch-label, region-mask]
scale:
  slides:
    value: 155
    source: sicap-archive
    note: Rows in wsi_labels.xlsx inside the release. The preprint is inconsistent; its abstract and the Section 2 Table 1 total give 182 WSIs, while the Section 2 text says 155 biopsies, matching the release.
  patients:
    value: 95
    source: sicap-archive
    note: Distinct patient IDs in wsi_labels.xlsx; matches preprint Section 2.
  patches:
    value: 18783
    source: sicap-archive
    note: JPEG patches in the images folder, each with a PNG mask. The proposed partition uses 12,081 of them (9,959 train + 2,122 test).
version:
  value: Mendeley Data version 2 (published 2020-10-22, DOI 10.17632/9xxm58dvs3.2); version 1 was published 2020-07-20. The readme inside the archive is headed "Version 1, 2020-05".
  source: sicap-mendeley
  note: The record does not describe what changed between Mendeley versions; only the version 2 archive listing was inspected.
splits:
  value: Patient-based partition shipped as spreadsheets. Test fold, 9,959 train patches from 124 slides and 2,122 test patches from 31 slides; plus four validation folds (Val1 to Val4) for cross-validation.
  source: sicap-archive
  note: Per-class patch counts match preprint Table 3, which gives no slide counts; the 124 / 31 slide counts come from the release files (the CONCH paper gives the same). Non-cancerous patches in the partition come only from non-cancerous slides; cancerous patch labels are the majority grade of the mask.
evaluation_protocol:
  value: Patch-level Gleason grade (non-cancerous, 3, 4, 5) and biopsy-level Gleason score, both reported with quadratic Cohen's kappa in the source paper.
  source: sicap-preprint
access:
  method: open-download
  details: Single ZIP archive (about 2.2 GB) on Mendeley Data; the record page offers "Download All" without signing in.
  source: sicap-mendeley
terms:
  license: CC BY 4.0
  redistribution: CC BY 4.0 allows sharing and adaptation with attribution.
  source: sicap-mendeley
official_url: https://data.mendeley.com/datasets/9xxm58dvs3/2
primary_paper: sicap-paper
limitations:
  - value: Despite the record title, the archive contains patches, masks and label tables, not whole-slide image files.
    source: sicap-archive
  - value: Single institution and a single scanner model, so site and scanner shift are not represented.
    source: sicap-preprint
  - value: Patch labels are derived from the masks by majority vote; patches with under 20 % tissue were not extracted.
    source: sicap-archive
  - value: Cribriform-pattern labels exist only for a subset of Gleason 4 patches (G4C column in the partition tables).
    source: sicap-archive
  - value: The preprint's per-class patch totals in the text (10,339 in all) do not match its Table 3 (12,081); the released partition files match Table 3.
    source: sicap-preprint
review_status: verified
last_verified: 2026-11-20
reviewer_notes: >-
  patch-label reflects the partition spreadsheets, which give one class per patch (one-hot NC / G3 /
  G4 / G5); region-mask reflects the per-patch PNG masks; slide-label reflects wsi_labels.xlsx.
sources:
  - key: sicap-mendeley
    title: "Silva-Rodríguez J. SICAPv2 - Prostate Whole Slide Images with Gleason Grades Annotations. Mendeley Data, v2 (2020)"
    url: https://data.mendeley.com/datasets/9xxm58dvs3/2
    kind: data-portal
    accessed: 2026-11-20
    note: Version 1 record (https://data.mendeley.com/datasets/9xxm58dvs3/1) has the same description and licence.
  - key: sicap-archive
    title: "SICAPv2.zip (Mendeley v2): file listing, readme.txt, wsi_labels.xlsx and partition tables"
    url: https://data.mendeley.com/public-api/datasets/9xxm58dvs3/files?folder_id=root&version=2
    kind: data-portal
    accessed: 2026-11-20
    note: Read through HTTP range requests on the archive's ZIP directory and small metadata files (about 6.5 MB of 2.16 GB). No image data was downloaded.
  - key: sicap-paper
    title: "Silva-Rodríguez J. et al. Going deeper through the Gleason scoring scale: an automatic end-to-end system for histology prostate grading and cribriform pattern detection. Comput Methods Programs Biomed 195, 105637 (2020)"
    url: https://doi.org/10.1016/j.cmpb.2020.105637
    kind: paper
    accessed: 2026-11-20
    note: Journal page not opened; metadata confirmed via Crossref and the Mendeley record. Facts come from the arXiv preprint below.
