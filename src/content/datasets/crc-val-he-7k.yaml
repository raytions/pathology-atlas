id: crc-val-he-7k
title: CRC-VAL-HE-7K
aliases: [CRC-100K (test set)]
summary: >-
  7,180 H&E patches with the same nine tissue classes, size and resolution as NCT-CRC-HE-100K, from
  colorectal adenocarcinoma patients who do not appear in that set. Released as its external test
  set, and it is the test split behind most reported colorectal tissue-classification results
  catalogued here.
organs: [colorectum]
diseases: [colorectal-cancer]
tasks: [colorectal-tissue-classification]
specimen: H&E colorectal adenocarcinoma slides from the NCT tissue bank, Heidelberg (the DACHS study, per Kather et al. 2019); no patient overlap with NCT-CRC-HE-100K.
stains: [he]
data_units: [patch]
annotation_granularity: [patch-label]
scale:
  patches:
    value: 7180
    source: zenodo-crc
  storage:
    value: About 0.8 GB (CRC-VAL-HE-7K.zip)
    source: zenodo-crc
version:
  value: Zenodo v0.1 (2018-04-07, DOI 10.5281/zenodo.1214456), a single file in the same record as NCT-CRC-HE-100K.
  source: zenodo-crc
splits:
  value: Intended as the validation / external test set for models trained on NCT-CRC-HE-100K.
  source: zenodo-crc
evaluation_protocol:
  value: Nine-class patch classification on all 7,180 patches. Kather et al. 2019 report overall nine-class accuracy for a VGG19 trained on NCT-CRC-HE-100K.
  source: kather-paper
access:
  method: open-download
  details: ZIP archive on Zenodo, no account needed.
  source: zenodo-crc
terms:
  license: CC BY 4.0
  redistribution: CC BY 4.0 allows sharing and adaptation with attribution.
  source: zenodo-crc
official_url: https://doi.org/10.5281/zenodo.1214456
primary_paper: kather-paper
limitations:
  - value: All tissue came through the NCT tissue bank, from the multicentre DACHS study per Kather et al. 2019; the scanner is not stated, so how much site or scanner shift it tests is unclear.
    source: kather-paper
review_status: verified
last_verified: 2026-11-20
reviewer_notes: >-
  Patient and slide counts are left empty because sources disagree. The Zenodo record says 50
  patients. Kather et al. 2019 say the set was built from 25 H&E slides of the DACHS study and the
  abstract says 25 patients. The UNI preprint says 50 WSIs. The record does not say whether colour
  normalisation was applied, but Kather et al. 2019 (Methods) say all images in their cohorts were
  Macenko-normalised; one model README describes normalised and unnormalised variants of
  this test set, which the record does not list.
