id: h0-mini
title: H0-mini
short_name: H0-mini
summary: >-
  A ViT-B/14 tile encoder distilled from H-optimus-0 with DINOv2-style self-distillation on about
  43 million tiles from 6,093 TCGA slides. The paper reports it as competitive with much larger
  encoders; it is a separate model with its own, more restrictive licence.
category: foundation-model
tasks: [representation-learning, roi-classification, wsi-classification]
organs: []
input_granularity: [patch]
output_granularity: [patch-embedding]
year: 2025
primary_paper: h0mini-preprint
weights:
  availability: gated
  url: https://huggingface.co/bioptimus/H0-mini
  license: CC BY-NC-ND 4.0
  conditions: Request access on Hugging Face; the primary account email must match an institutional email. Non-commercial research only; derivative models (including distilled ones) may not be shared.
  source: h0mini-model-card
datasets:
  - dataset: camelyon16
    use: evaluation
    task: lymph-node-metastasis-detection
    evidence: h0mini-preprint
    note: >-
      Table 1 (arXiv v3), "Cam16" column under slide-level classification in the eva benchmark;
      balanced accuracy. Splits follow the eva framework's protocol, not necessarily the challenge
      split.
  - dataset: panda
    use: evaluation
    task: gleason-grading
    evidence: h0mini-preprint
    note: >-
      Table 1 (arXiv v3), "Panda" column under slide-level classification in the eva benchmark; balanced
      accuracy, eva protocol and splits.
  - dataset: crc-val-he-7k
    use: evaluation
    task: colorectal-tissue-classification
    evidence: h0mini-preprint
    note: >-
      Table 1 (arXiv v3), "Crc" column under patch-level classification in the eva benchmark; balanced
      accuracy. The paper does not name the data; the eva documentation defines this task as training
      on NCT-CRC-HE-100K and testing on CRC-VAL-HE-7K.
limitations:
  - value: Pretraining tiles come from TCGA, so downstream TCGA-based evaluations can overlap with pretraining; the paper flags possibly over-estimated results for such cases.
    source: h0mini-preprint
review_status: verified
last_verified: 2026-11-20
reviewer_notes: >-
  related-to h-optimus-0 (teacher; distillation). All three dataset relations come from the eva
  benchmark in Table 1; eva fixes its own protocol and splits. The model card describes code and weights under
  the same CC BY-NC-ND 4.0 terms; no separate code repository was checked, so code is not recorded.
sources:
  - key: h0mini-preprint
    title: "Filiot A. et al. Distilling foundation models for robust and efficient models in digital pathology (arXiv 2501.16239 v3)"
    url: https://arxiv.org/abs/2501.16239
    kind: preprint
    accessed: 2026-11-20
  - key: h0mini-model-card
    title: bioptimus/H0-mini model card (Hugging Face)
    url: https://huggingface.co/bioptimus/H0-mini
    kind: model-card
    accessed: 2026-11-20
  - key: eva-crc
    title: "kaiko-ai eva documentation: CRC dataset page"
    url: https://kaiko-ai.github.io/eva/main/datasets/crc/
    kind: official-site
    accessed: 2026-11-20
    note: Used only to identify which data the eva "CRC" task uses; it is not evidence of any result.
