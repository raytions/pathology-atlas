reviewer_notes: >-
  No evaluation on a catalogued dataset is recorded. PANDA appears in the repository only as a
  fine-tuning example with pre-extracted embeddings, which is not a reported result; the article
  text checked does not mention a catalogued dataset. Outputs: the tile encoder gives patch embeddings and the
  LongNet slide encoder turns tile embeddings plus coordinates into a slide embedding; the README
  loads both from the gated Hugging Face repository ("Inference with the slide encoder").
  The repository also lists a GigaPath-Flash variant (arXiv 2026) that is not covered here.
