id: prov-gigapath
title: Prov-GigaPath
short_name: Prov-GigaPath
summary: >-
  A whole-slide foundation model from Providence and Microsoft: a tile encoder pretrained on about
  1.3 billion 256 x 256 tiles from 171,189 slides of the Providence health network, plus a
  LongNet-based slide encoder that turns tile embeddings and their coordinates into slide-level
  representations.
category: foundation-model
