id: virchow
title: Virchow
short_name: Virchow
summary: >-
  A 632M-parameter ViT-H/14 image encoder trained with DINOv2 on about 1.5 million whole-slide
  images from Memorial Sloan Kettering Cancer Center, used for tile-level probing and as the
  backbone of a pan-cancer slide-level detector in its paper.
