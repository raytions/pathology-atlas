id: conch
title: CONCH
short_name: CONCH
summary: >-
  A vision-language foundation model trained contrastively on about 1.17 million histopathology
  image-caption pairs. Its ViT-B/16 image encoder gives patch embeddings for supervised heads, and
  the paired text encoder allows zero-shot classification and retrieval from text prompts.
category: foundation-model
tasks: [representation-learning, roi-classification, wsi-classification]
organs: []
input_granularity: [patch]
output_granularity: [patch-embedding]
year: 2024
venue:
  value: Nature Medicine
  source: conch-paper
primary_paper: conch-paper
code:
  url: https://github.com/mahmoodlab/CONCH
  license: CC-BY-NC-ND 4.0
  conditions: The README states that the model and associated code are released under CC-BY-NC-ND 4.0 for non-commercial academic research with attribution. GitHub's licence detector does not classify the repository licence.
  source: conch-repo
weights:
  availability: gated
  url: https://huggingface.co/MahmoodLab/CONCH
  license: CC-BY-NC-ND 4.0
  conditions: Request access on Hugging Face and accept the terms; the account's primary email must be an institutional address. Non-commercial academic use only.
  source: conch-model-card
datasets:
  - dataset: sicapv2
    use: evaluation
    task: gleason-pattern-classification
    evidence: conch-preprint
    note: >-
      ROI-level Gleason pattern classification on SICAP (paper reference 92). Zero-shot on the test
      split (n = 2,122 tiles, quadratic kappa): arXiv v2 Table 5 with prompt ensembling, Table 12
      without. Supervised linear probe on the 9,959 / 2,122 split: Table 18. The paper describes 512 x
      512 tiles from 155 WSIs at 10x, with 9,959 training tiles from 124 WSIs and 2,122 test tiles from
      31 WSIs; these counts match the Test-fold partition files in the SICAPv2 release exactly. The paper
      does not name a Mendeley version.
  - dataset: crc-val-he-7k
    use: evaluation
    task: colorectal-tissue-classification
    evidence: conch-preprint
    note: >-
      "CRC100k" in the paper. Zero-shot on the official 7,180-tile test set: arXiv v2 Table 6 (prompt
      ensembling) and Table 13 (without). Supervised linear probe trained on the official 100,000-tile
      training split and tested on the 7,180 tiles: Table 19. The paper does not say whether the
      normalised or unnormalised training images were used, and describes the tiles as coming from
      50 patients.
limitations:
  - value: The publicly released weights omit the multimodal (captioning) decoder; the README states that the image and text encoders are intact.
    source: conch-repo
review_status: verified
last_verified: 2026-11-20
reviewer_notes: >-
  Table numbers refer to arXiv v2 (the latest version on 2026-11-20) and were not mapped to the
  Nature Medicine Extended Data numbering. Not recorded because the schema cannot express them: text
  embeddings and zero-shot outputs, and zero-shot tumour segmentation on 31 SICAP test slides (Table
  26). Evaluations on WSSS4LUAD, TCGA BRCA / NSCLC / RCC and DHMC LUAD are not recorded
  because those datasets are not catalogued.
