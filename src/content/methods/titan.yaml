id: titan
title: TITAN
short_name: TITAN
summary: >-
  A multimodal whole-slide foundation model: a six-layer ViT slide encoder over CONCH v1.5 patch
  features, pretrained with iBOT on 335,645 slides (Mass-340K) and then aligned with synthetic
  region captions and pathology reports. It outputs one slide embedding and also supports zero-shot
  classification and report generation through its text components.
category: foundation-model
tasks: [wsi-classification]
organs: []
input_granularity: [patch, patch-features]
output_granularity: [slide-embedding]
year: 2025
venue:
  value: Nature Medicine 31, 3749-3761 (2025)
  source: titan-paper
primary_paper: titan-paper
code:
  url: https://github.com/mahmoodlab/TITAN
  license: CC-BY-NC-ND 4.0
  conditions: The README states that the model and associated code are released under CC-BY-NC-ND 4.0 for non-commercial academic research with attribution; commercial use of the model or its derivatives (including models trained on its outputs) is prohibited without prior approval. There is no LICENSE file and GitHub's licence detector reports none.
  source: titan-repo
weights:
  availability: gated
  url: https://huggingface.co/MahmoodLab/TITAN
  license: CC-BY-NC-ND 4.0
  conditions: Request access on Hugging Face; the account's primary email must match an institutional email, each user registers individually, and redistribution is not allowed. The repository ships the TITAN slide and text encoders plus CONCH v1.5; the multimodal decoder weights are not released.
  source: titan-model-card
datasets:
  - dataset: bracs
    use: evaluation
    task: breast-lesion-subtyping
    evidence: titan-supplement
    note: >-
      Linear probing (logistic regression, SimpleShot, 20-NN) on frozen slide embeddings for fine
      (7-class, Supplementary Table 29) and coarse (3-class, Supplementary Table 30) subtyping;
      balanced accuracy. Uses the authors' own five patient-level, label-stratified 60:20:20 splits,
      not the official BRACS split. arXiv v1 has the same results as Extended Data Tables 21 and 22.
  - dataset: panda
    use: evaluation
    task: gleason-grading
    evidence: titan-supplement
    note: >-
      Linear probing for six-class ISUP grading, quadratic Cohen's kappa (Supplementary Table 36;
      Extended Data Table 28 in arXiv v1). Slides were quality-filtered to 9,555 and split 80:10:10 by
      the authors, not by the challenge, so numbers are not comparable with the leaderboard.
limitations:
  - value: Pretraining slides (Mass-340K, mostly Mass General Brigham collections) and reports are not public.
    source: titan-paper
  - value: Reports no results on the patch-level datasets catalogued here or on CAMELYON16 / 17; BRACS and PANDA are evaluated by linear probing only, not few-shot or zero-shot.
    source: titan-supplement
review_status: verified
last_verified: 2026-11-24
reviewer_notes: >-
  related-to conch (TITAN uses CONCH v1.5 patch features and its text encoder; CONCH v1.5 is not a
  separate entry). Not recordable with the current schema: zero-shot classification, retrieval and
  report generation (text outputs, coverage gap 3). Not tagged representation-learning because the
  later training stages use caption and report supervision. The paper gives no slide-encoder parameter
  count. Card vs paper: the card describes GTEx slides as in addition to Mass-340K, while the paper
  counts them inside it; the card still calls the model a preview. In both versions each table caption
  sits below its table; an earlier inbox note mapped the wrong tables because of this. The paper's
  Methods says BRACS fine subtyping has "six classes" but lists seven, and the tables use C = 7.
