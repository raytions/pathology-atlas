id: transmil
title: TransMIL
short_name: TransMIL
summary: >-
  Transformer-based correlated MIL. Instead of treating patches as independent samples, it uses
  self-attention to model correlations between them, aiming to capture both morphological and
  spatial information before predicting a slide label.
category: mil-aggregator
tasks: [wsi-classification]
organs: []
input_granularity: [patch-features]
output_granularity: [slide-label]
year: 2021
venue:
  value: NeurIPS 2021
  source: transmil-repo
primary_paper: transmil-preprint
code:
  url: https://github.com/szc19990412/TransMIL
  license: GPL-3.0
  conditions: There is no LICENSE file (GitHub's detector reports none), but the README states the code is available under GPLv3 for non-commercial academic purposes.
  source: transmil-repo
weights:
