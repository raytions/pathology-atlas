id: threads
title: THREADS
short_name: THREADS
summary: >-
  A slide-level foundation model that turns CONCH v1.5 patch features into one 1024-dimensional
  slide embedding. Its slide encoder was trained to align each slide with the molecular profile
  (bulk RNA-seq or targeted DNA panel) of the same tissue, on 47,171 H&E slides from MGH, BWH, TCGA
  and GTEx.
category: foundation-model
tasks: [wsi-classification]
organs: []
input_granularity: [patch, patch-features]
output_granularity: [slide-embedding]
year: 2025
primary_paper: threads-preprint
weights:
  availability: none-found
  conditions: >-
    The paper's Code availability section says "THREADS model weights and code to extract slide
    embeddings will be released upon publication". On 2026-11-24 the Mahmood Lab TRIDENT README still
    lists the THREADS slide encoder as "Coming Soon!", and no THREADS repository or Hugging Face model
    card was found.
  source: threads-preprint
datasets:
  - dataset: bracs
    use: evaluation
    task: breast-lesion-subtyping
    evidence: threads-preprint
    note: >-
      Coarse (3-class) and fine (7-class) slide subtyping; balanced accuracy, mean and standard error
      over 5-fold cross-validation (Extended Data Table 23 of arXiv v1; few-shot results in Extended
      Data Table 41). Not the official split: the authors "redefined train-test splits with an 80:20
      ratio", keeping each patient's slides together (Online Methods, BRACS).
  - dataset: panda
    use: evaluation
    task: gleason-grading
    evidence: threads-preprint
    note: >-
      Six-class ISUP grading; quadratic weighted kappa, mean and 95% CI over 100 bootstraps of a
      single fold (Extended Data Table 14 of arXiv v1). Slides with equivocal labels were excluded
      (9,555 remain) and the train / test split is the one used by Prov-GigaPath (7,647 / 954 WSIs),
      not a PANDA challenge split, so numbers are not comparable with the leaderboard.
limitations:
  - value: Described in a preprint only (arXiv v1, January 2025), and the weights have not been released, so results cannot be reproduced yet.
    source: threads-preprint
  - value: Evaluated only on slide- and patient-level tasks; it reports no results on the patch-level datasets catalogued here (NCT-CRC-HE-100K, CRC-VAL-HE-7K, MHIST, SICAPv2) or on CAMELYON16 / 17.
    source: threads-preprint
  - value: Pretraining includes TCGA and GTEx slides, so downstream evaluations on those cohorts can overlap with pretraining data.
    source: threads-preprint
review_status: needs-review
reviewer_notes: >-
  related-to conch (THREADS uses CONCH v1.5 patch features; CONCH v1.5 is not catalogued as its own
  entry). Slide encoder details from Online Methods: gated-attention ABMIL with several heads, 768-dim
  CONCH v1.5 features projected to 1024 dims, about 11.3M parameters for the two-head model. RNA is
  encoded with a fine-tuned scGPT and DNA with an MLP on a multi-hot vector. Paper evaluations run
  through Patho-Bench. Not tagged representation-learning because training is supervised by
  molecular profiles, not self-supervised on images alone. A journal version was not found
  (Semantic Scholar, Crossref, web search on 2026-11-24); recheck table numbers if one appears.
sources:
  - key: threads-preprint
    title: "Vaidya A., Zhang A., Jaume G. et al. Molecular-driven Foundation Model for Oncologic Pathology (arXiv 2501.16652 v1)"
    url: https://arxiv.org/abs/2501.16652v1
    kind: preprint
    accessed: 2026-11-24
  - key: trident-repo
    title: mahmoodlab/TRIDENT README, slide encoder table (GitHub)
    url: https://github.com/mahmoodlab/TRIDENT
    kind: repository
    accessed: 2026-11-24
    note: Lists the THREADS slide encoder as "Coming Soon!"; used only for release status.
