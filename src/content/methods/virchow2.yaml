id: virchow2
title: Virchow2
short_name: Virchow2
summary: >-
  A successor to Virchow trained on about 3.1 million MSKCC whole-slide images with tiles sampled
  at several magnifications (5x to 40x). Same ViT-H/14 size as Virchow (plus 4 register tokens) but a separate model with
  different data, weights and licence.
category: foundation-model
tasks: [representation-learning, roi-classification]
organs: []
input_granularity: [patch]
output_granularity: [patch-embedding]
year: 2024
primary_paper: virchow2-preprint
code:
