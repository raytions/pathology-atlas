    use: evaluation
    task: lymph-node-metastasis-detection
    evidence: virchow2-preprint
    note: >-
      Tile-level benchmark on Camelyon17-WILDS (96 x 96 tiles at 10x upsampled to 224, derived from
      CAMELYON17), weighted F1 in Table 2 (out-of-distribution tile-level tasks) of arXiv v3; Table 3 in v1 and v2. Not the original slide / pN-stage benchmark.
limitations:
