prediction_target: pN stage per patient, aggregated from slide-level metastasis categories.
summary: >-
  Combining slide-level findings (none, isolated tumour cells, micro- or macro-metastasis) across
  several lymph nodes into a patient-level pathological N stage. CAMELYON17 included it to assess
  automated pN staging.
