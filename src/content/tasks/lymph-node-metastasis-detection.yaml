id: lymph-node-metastasis-detection
title: Lymph-node metastasis detection
scope: specific
organs: [breast]
diseases: [breast-cancer-nodal-metastasis]
broader: [wsi-classification]
prediction_target: Presence of metastasis per slide; optionally the location of each lesion.
summary: >-
  Finding tumour deposits in sentinel lymph node sections. Benchmarks score it either per slide
  (is there a metastasis?) or per lesion (where is each one?), and the two settings need
  different annotations.
